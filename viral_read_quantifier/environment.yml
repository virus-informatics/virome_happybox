name: viral_read_quantifier
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - star=2.7.11b
  # fastp/samtools: unpinned because STAR=2.7.11b osx-arm64 builds require htslib<1.23.0a0
  # fastp>=1.2.0 requires libdeflate>=1.25 which conflicts with htslib 1.22.x (libdeflate<1.23)
  - fastp>=1.1.0,<2
  - samtools>=1.22.1,<2
  - pip
  - pip:
      - .
