name: viral_phylogeny_builder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # datasets / dataformat are both shipped by ncbi-datasets-cli
  - ncbi-datasets-cli=18.36.0
  - taxonkit=0.20.0
  # getorf is shipped by emboss
  - emboss=6.6.0
  - mmseqs2=18.8cc5c
  - mafft=7.526
  - trimal=1.5.1
  - seqkit=2.13.0
  # makeblastdb / blastp are shipped by blast
  - blast=2.17.0
  - iqtree=3.1.3
  # R packages for tree rendering (virome_ggtree_ref.R / virome_ggtree_add.R)
  - r-base=4.5.3
  - r-ape=5.8_1
  - r-phangorn=2.12.1
  - r-dplyr=1.2.1
  - r-ggplot2=4.0.3
  - r-ggnewscale=0.5.2
  - r-rcolorbrewer=1.1_3
  - bioconductor-ggtree=4.0.4
  - pip
  - pip:
      - .
